    let claseActualId = "c31";
    let pestanaActual = "teoria";

    function renderizarMenu(filtro = "") {
      const contenedorMenu = document.getElementById("menu-unidades");
      contenedorMenu.innerHTML = "";
      const textoFiltro = filtro.toLowerCase().trim();

      programaCurricular.forEach((unidad) => {
        const clasesFiltradas = unidad.clases.filter(c => 
          c.titulo.toLowerCase().includes(textoFiltro) || 
          c.numero.toLowerCase().includes(textoFiltro) ||
          unidad.titulo.toLowerCase().includes(textoFiltro)
        );

        if (textoFiltro && clasesFiltradas.length === 0) return;

        const estaAbierta = textoFiltro ? true : unidad.activa;

        const bloqueUnidad = document.createElement("div");
        bloqueUnidad.innerHTML = `
          <button 
            onclick="toggleUnidad('${unidad.id}')"
            class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/40 transition"
          >
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-sky-600 dark:text-sky-400 block">${unidad.numero}</span>
              <span class="font-semibold text-sm text-slate-800 dark:text-slate-100">${unidad.titulo}</span>
            </div>
            <svg class="w-4 h-4 text-slate-400 transform transition-transform ${estaAbierta ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="${estaAbierta ? 'block' : 'hidden'} bg-slate-50/70 dark:bg-slate-900/40 px-2 py-1.5 space-y-1">
            ${clasesFiltradas.map(clase => `
              <button 
                onclick="seleccionarClase('${clase.id}')"
                class="w-full text-left px-3 py-2 rounded-lg text-xs transition flex items-center justify-between gap-2 ${
                  claseActualId === clase.id 
                    ? 'bg-institucional-700 text-white font-semibold shadow-sm' 
                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700/60'
                }"
              >
                <span><strong>${clase.numero}:</strong> ${clase.titulo}</span>
                ${clase.desarrollada 
                  ? '<span class="px-1.5 py-0.5 text-[10px] rounded bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 font-bold shrink-0">Activa</span>' 
                  : '<span class="px-1.5 py-0.5 text-[10px] rounded bg-slate-300/50 dark:bg-slate-700 text-slate-500 dark:text-slate-400 shrink-0">En cola</span>'
                }
              </button>
            `).join("")}
          </div>
        `;
        contenedorMenu.appendChild(bloqueUnidad);
      });
    }

    function toggleUnidad(unidadId) {
      const unidad = programaCurricular.find(u => u.id === unidadId);
      if (unidad) {
        unidad.activa = !unidad.activa;
        renderizarMenu(document.getElementById("buscador-temas").value);
      }
    }

    function seleccionarClase(claseId) {
      claseActualId = claseId;
      pestanaActual = "teoria";
      renderizarMenu(document.getElementById("buscador-temas").value);
      renderizarClase();
    }

    function cambiarPestana(nuevaPestana) {
      pestanaActual = nuevaPestana;
      renderizarClase();
    }

    function obtenerDatosClaseActual() {
      for (const unidad of programaCurricular) {
        for (const clase of unidad.clases) {
          if (clase.id === claseActualId) {
            return { unidad, clase };
          }
        }
      }
      return null;
    }

    function renderizarClase() {
      const datos = obtenerDatosClaseActual();
      const contenedor = document.getElementById("contenedor-clase");
      if (!datos) return;

      const { unidad, clase } = datos;

      if (!clase.desarrollada) {
        contenedor.innerHTML = `
          <div class="border-b border-slate-200 dark:border-slate-700 pb-4 mb-6">
            <span class="text-xs font-bold uppercase tracking-widest text-sky-600 dark:text-sky-400">${unidad.numero} — ${unidad.titulo}</span>
            <h2 class="text-2xl font-bold mt-1">${clase.numero}: ${clase.titulo}</h2>
          </div>
          <div class="p-6 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-200">
            <h3 class="font-bold text-base mb-2">Módulo estructurado listo para carga incremental</h3>
            <p class="text-sm leading-relaxed">
              Esta clase forma parte del índice oficial extraído de tu cuadernillo <strong>Formación Ética y Ciudadana 2026</strong>. Para evitar recortes de código y garantizar el desarrollo exhaustivo de cada tema, pedime en el chat: <em>"Desarrollá el contenido completo de la ${unidad.numero} desde el cuaderno Ética 2026"</em>.
            </p>
          </div>
        `;
        return;
      }

      let contenidoPestana = "";

      if (pestanaActual === "teoria") {
        contenidoPestana = `
          <div class="space-y-4 text-slate-700 dark:text-slate-200 leading-relaxed text-base">
            ${clase.teoria.map(p => `<p class="text-justify">${p}</p>`).join("")}
          </div>

          <div class="mt-8">
            <h3 class="text-lg font-bold text-slate-800 dark:text-white mb-3 flex items-center gap-2">
              <span class="w-2 h-5 bg-sky-600 rounded-sm inline-block"></span>
              Cuadro Didáctico de Síntesis para la Carpeta
            </h3>
            <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-institucional-800 text-white">
                    ${clase.cuadro.columnas.map(col => `<th class="p-3.5 font-semibold border-b border-slate-600">${col}</th>`).join("")}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                  ${clase.cuadro.filas.map((fila, idx) => `
                    <tr class="${idx % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-slate-50 dark:bg-slate-800/50'}">
                      ${fila.map((celda, cIdx) => `<td class="p-3.5 ${cIdx === 0 ? 'font-bold text-institucional-700 dark:text-sky-400' : ''}">${celda}</td>`).join("")}
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (pestanaActual === "caso") {
        contenidoPestana = `
          <div class="bg-sky-50/70 dark:bg-slate-700/40 border-l-4 border-sky-600 p-6 rounded-r-xl space-y-4">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-sky-600 text-white">Estudio de Caso / Dilema Práctico</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Aplicación Situada (3.° Año)</span>
            </div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-white">${clase.caso.titulo}</h3>
            <p class="text-slate-700 dark:text-slate-200 leading-relaxed text-justify text-base">
              ${clase.caso.relato}
            </p>
            <div class="p-4 bg-white dark:bg-slate-800 rounded-lg border border-sky-200 dark:border-slate-600 mt-4">
              <p class="text-sm font-semibold text-institucional-700 dark:text-sky-300">
                Pregunta disparadora para el debate en el aula:
              </p>
              <p class="text-sm text-slate-700 dark:text-slate-200 mt-1 italic">
                "${clase.caso.preguntaGuia}"
              </p>
            </div>
          </div>
        `;
      } else if (pestanaActual === "actividades") {
        contenidoPestana = `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 bg-emerald-50 dark:bg-emerald-950/30 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800/60">
              <div>
                <h3 class="font-bold text-emerald-900 dark:text-emerald-300 text-sm">Guía de Actividades y Análisis Crítico para la Carpeta</h3>
                <p class="text-xs text-emerald-700 dark:text-emerald-400">Tiempo estimado de resolución áulica: 40 minutos. Respondé con fundamentación teórica.</p>
              </div>
              <button 
                onclick="imprimirFichaAlumno()"
                class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow transition flex items-center gap-2 shrink-0 self-start sm:self-auto"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                </svg>
                Imprimir Ficha del Alumno (PDF)
              </button>
            </div>

            <ol class="space-y-4">
              ${clase.actividades.map((act, i) => `
                <li class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-700 flex gap-3.5 items-start">
                  <span class="w-7 h-7 rounded-full bg-institucional-700 text-white font-bold text-sm flex items-center justify-center shrink-0 mt-0.5">
                    ${i + 1}
                  </span>
                  <div class="text-slate-700 dark:text-slate-200 text-sm sm:text-base leading-relaxed">
                    ${act}
                  </div>
                </li>
              `).join("")}
            </ol>
          </div>
        `;
      }

      contenedor.innerHTML = `
        <!-- Encabezado de la Clase -->
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 border-b border-slate-200 dark:border-slate-700 pb-5">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold uppercase tracking-widest px-2.5 py-0.5 rounded bg-institucional-100 dark:bg-institucional-900 text-institucional-700 dark:text-sky-300">
                ${unidad.numero}: ${unidad.titulo}
              </span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-2">
              ${clase.numero}: ${clase.titulo}
            </h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">
              📌 Encuadre Conceptual y Normativo: ${clase.normativa}
            </p>
          </div>

          <button 
            onclick="imprimirFichaAlumno()"
            class="px-3.5 py-2 bg-institucional-700 hover:bg-institucional-500 text-white font-semibold rounded-lg text-xs shadow-sm transition flex items-center gap-2 shrink-0 self-start"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
            </svg>
            Imprimir Ficha (PDF)
          </button>
        </div>

        <!-- Barra de Pestañas Interactivas -->
        <div class="flex border-b border-slate-200 dark:border-slate-700 mt-6 mb-6 gap-2 overflow-x-auto">
          <button 
            onclick="cambiarPestana('teoria')"
            class="px-4 py-2.5 font-bold text-sm rounded-t-lg border-b-2 transition whitespace-nowrap ${
              pestanaActual === 'teoria'
                ? 'border-institucional-700 text-institucional-700 dark:border-sky-400 dark:text-sky-400 bg-slate-50 dark:bg-slate-700/40'
                : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400'
            }"
          >
            1. Teoría Simple y Cuadro
          </button>
          <button 
            onclick="cambiarPestana('caso')"
            class="px-4 py-2.5 font-bold text-sm rounded-t-lg border-b-2 transition whitespace-nowrap ${
              pestanaActual === 'caso'
                ? 'border-institucional-700 text-institucional-700 dark:border-sky-400 dark:text-sky-400 bg-slate-50 dark:bg-slate-700/40'
                : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400'
            }"
          >
            2. Caso Práctico Situado
          </button>
          <button 
            onclick="cambiarPestana('actividades')"
            class="px-4 py-2.5 font-bold text-sm rounded-t-lg border-b-2 transition whitespace-nowrap ${
              pestanaActual === 'actividades'
                ? 'border-institucional-700 text-institucional-700 dark:border-sky-400 dark:text-sky-400 bg-slate-50 dark:bg-slate-700/40'
                : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400'
            }"
          >
            3. Actividades de Clase
          </button>
        </div>

        <!-- Contenido Dinámico de la Pestaña -->
        <div>
          ${contenidoPestana}
        </div>
      `;
    }

    function filtrarClases(valor) {
      renderizarMenu(valor);
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark");
    }

    function imprimirFichaAlumno() {
      const datos = obtenerDatosClaseActual();
      if (!datos || !datos.clase.desarrollada) return;
      const { unidad, clase } = datos;

      const areaImprimible = document.getElementById("contenido-imprimible");
      areaImprimible.innerHTML = `
        <div style="font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.45; color: #000;">
          <div style="border: 2px solid #000; padding: 12px; margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; font-size: 9pt; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 6px; margin-bottom: 8px;">
              <span>PROVINCIA DE MISIONES • EDUCACIÓN SECUNDARIA ORIENTADA</span>
              <span>CICLO LECTIVO 2026</span>
            </div>
            <div style="font-size: 13pt; font-weight: bold; text-align: center; margin-bottom: 6px;">
              FORMACIÓN ÉTICA Y CIUDADANA — 3.° AÑO | FICHA DE CLASE DEL ESTUDIANTE
            </div>
            <div style="font-size: 10pt; text-align: center; margin-bottom: 10px;">
              Docente: Prof. Alberto Carlos Frías • ${unidad.numero}: ${unidad.titulo}
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 10pt; padding-top: 6px; border-top: 1px dotted #000;">
              <span><strong>Estudiante:</strong> ...........................................................................</span>
              <span><strong>Curso y División:</strong> 3.° ......</span>
              <span><strong>Fecha:</strong> ....../....../2026</span>
            </div>
          </div>

          <h2 style="font-size: 12pt; font-weight: bold; text-transform: uppercase; border-bottom: 1.5px solid #000; padding-bottom: 4px; margin-bottom: 10px;">
            ${clase.numero}: ${clase.titulo}
          </h2>

          <h3 style="font-size: 11pt; font-weight: bold; margin-top: 12px; margin-bottom: 6px;">1. Fundamentación Teórica y Marco Conceptual</h3>
          ${clase.teoria.map(p => `<p style="text-align: justify; margin-bottom: 8px;">${p}</p>`).join("")}

          <h3 style="font-size: 11pt; font-weight: bold; margin-top: 14px; margin-bottom: 6px;">2. Cuadro Comparativo de Síntesis</h3>
          <table style="width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 9.5pt;">
            <thead>
              <tr>
                ${clase.cuadro.columnas.map(c => `<th style="border: 1px solid #000; padding: 6px; background: #eee; text-align: left;">${c}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${clase.cuadro.filas.map(f => `
                <tr>
                  ${f.map(celda => `<td style="border: 1px solid #000; padding: 6px; vertical-align: top;">${celda}</td>`).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>

          <h3 style="font-size: 11pt; font-weight: bold; margin-top: 14px; margin-bottom: 6px;">3. Caso Práctico de Análisis: ${clase.caso.titulo}</h3>
          <p style="text-align: justify; border: 1px solid #000; padding: 8px; margin-bottom: 14px; background: #fafafa;">
            ${clase.caso.relato}
          </p>

          <h3 style="font-size: 11pt; font-weight: bold; margin-top: 14px; margin-bottom: 6px;">4. Actividades Prácticas para la Carpeta</h3>
          <ol style="padding-left: 20px; margin-bottom: 16px;">
            ${clase.actividades.map(a => `<li style="margin-bottom: 8px; text-align: justify;">${a}</li>`).join("")}
          </ol>
        </div>
      `;

      window.print();
    }

    // Inicializar aplicación mostrando directamente la Clase 31 de la Integración Final
    renderizarMenu();
    renderizarClase();
  </script>
</body>
</html>
